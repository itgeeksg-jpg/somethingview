<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SomethingView has moved</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #131722; color: #d1d4dc;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, sans-serif; text-align: center; padding: 16px; }
    a { color: #5b8cff; }
  </style>
</head>
<body>
  <p>SomethingView has moved to<br><a id="go" href="https://somethingview.itgeeksg.workers.dev/">somethingview.itgeeksg.workers.dev</a></p>
  <script>
    // Forward to the new address, taking this device's sync key along so its lists come too
    var dest = 'https://somethingview.itgeeksg.workers.dev/';
    try {
      var key = (JSON.parse(localStorage.getItem('somethingview:v1') || '{}').settings || {}).syncKey || '';
      if (/^[a-f0-9]{32}$/.test(key)) dest += '#sync=' + key;
    } catch (e) {}
    // Remove the old service worker that could keep serving the previous version
    try { navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
    document.getElementById('go').href = dest;
    location.replace(dest);
  </script>
</body>
</html>
